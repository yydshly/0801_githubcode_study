name: Deploy research gallery

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-research-pages.yml"
      - "research-projects.json"
      - "research-site/**"
      - "scripts/build-research-pages.mjs"
      - "wallet-finance-header/**"
      - "prompt-master-comparison-demo/**"
      - "complete-shelf-study/**"
      - "particle-flower-lab/**"
      - "glass-worlds-gallery/**"
      - "starfield-process-demo/**"
      - "threejs-awesome-graphics-agent-skills-demo/**"
      - "ocean-atlas-product-demo/**"
      - "awesome-design-md-lab/**"
      - "research-todos/infinite-build-game-research/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build all enabled research projects
        run: node scripts/build-research-pages.mjs --install --base="/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
